services:
  - type: keyvalue
    name: whiteboard-redis
    plan: free
    ipAllowList: []

  - type: web
    name: whiteboard-backend
    runtime: node
    rootDir: whiteboard/server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        fromService:
          type: web
          name: whiteboard-frontend
          property: url
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: whiteboard-redis
          property: connectionString

  - type: web
    name: whiteboard-frontend
    runtime: static
    rootDir: whiteboard/client
    buildCommand: npm install && npm run build
    staticPublishPath: whiteboard/client/dist
    envVars:
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: whiteboard-backend
          property: url
